name: Restore index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore index.html and wire in the safety add-ons
        run: |
          python3 - <<'PY'
          import base64, pathlib
          p = pathlib.Path('index.html')
          s = p.read_text(encoding='utf-8', errors='replace').strip()
          if not s.startswith('<'):
              s = base64.b64decode(s).decode('utf-8')
              print('decoded index.html from base64')
          else:
              print('index.html already looks like HTML')
          if '<link rel="stylesheet" href="safety.css">' not in s:
              s = s.replace(
                  '<link rel="stylesheet" href="style.css">',
                  '<link rel="stylesheet" href="style.css">\n<link rel="stylesheet" href="safety.css">')
          if '<script src="safety.js" defer></script>' not in s:
              s = s.replace(
                  '<script src="extras.js" defer></script>',
                  '<script src="extras.js" defer></script>\n<script src="safety.js" defer></script>')
          p.write_text(s, encoding='utf-8')
          print('index.html restored; safety.css and safety.js wired in')
          PY

      - name: Commit the restored file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Restore index.html and wire in the safety add-ons"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
