name: Restore index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode index.html if it was committed as base64
        run: |
          python3 -c "import base64, pathlib; p = pathlib.Path('index.html'); s = p.read_text(encoding='utf-8', errors='replace').strip(); p.write_bytes(base64.b64decode(s)) if not s.startswith('<') else print('already html, nothing to do')"

      - name: Commit the restored file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Restore index.html (was committed with wrong encoding)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
